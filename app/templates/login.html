<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>t3version - Sign in</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f4f2;color:#242424;margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center}
.card{background:#fff;border:1px solid #e0e0e0;border-radius:10px;padding:32px;width:340px;box-shadow:0 4px 24px rgba(0,0,0,.06)}
h1{margin:0 0 4px;font-size:22px}
p.sub{color:#666;margin:0 0 20px;font-size:14px}
label{display:block;font-size:13px;margin:14px 0 5px;color:#444}
input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:6px;font-size:15px}
button{margin-top:22px;width:100%;padding:11px;background:#242424;color:#fff;border:0;border-radius:6px;font-size:15px;cursor:pointer}
button:hover{background:#000}
.error{color:#b00020;font-size:13px;margin-top:12px}
</style>
</head>
<body>
<div class="card">
<h1>t3version</h1>
<p class="sub">Identify a TYPO3 version from a public URL. Sign in to continue.</p>
<form method="post" action="/login">
<label for="username">Username</label>
<input id="username" name="username" type="text" autocomplete="username" required>
<label for="password">Password</label>
<input id="password" name="password" type="password" autocomplete="current-password" required>
<button type="submit">Sign in</button>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
</form>
</div>
</body>
</html>
